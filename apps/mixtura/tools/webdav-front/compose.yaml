# Reverse proxies that add CORS in front of a WebDAV server (README.md).
#   WEBDAV_PASSWORD=... docker compose --profile nginx up -d
#   WEBDAV_PASSWORD=... docker compose --profile caddy up -d
services:
  # The WebDAV server of tools/webdav-server, started without any CORS answer.
  backend:
    image: httpd:2.4.71@sha256:32e9403360ab2f1047523e72f256527fb9aee68b342abf6ad03f0d629157f3d9
    entrypoint: ['/entrypoint.sh']
    restart: unless-stopped
    environment:
      WEBDAV_USER: ${WEBDAV_USER:-mixtura}
      WEBDAV_PASSWORD: ${WEBDAV_PASSWORD:?set WEBDAV_PASSWORD}
      BACKEND_ONLY: '1'
    volumes:
      - ../webdav-server/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ../webdav-server/entrypoint.sh:/entrypoint.sh:ro
      - dav-data:/var/dav

  nginx:
    profiles: ['nginx']
    # Docker Official Image nginx 1.30.6; the digest pins the content, the tag lets Dependabot update both.
    image: nginx:1.31.8@sha256:165ddde8751e75a1c907d24ef10d9f6deb08b57e0fe56caf67512486aff76d82
    restart: unless-stopped
    depends_on: [backend]
    environment:
      # A regular expression of the page origins allowed to call the server.
      ALLOWED_ORIGINS_REGEX: ${ALLOWED_ORIGINS_REGEX:-^(https://mixtura[.]nexumia[.]de|http://(localhost|127[.]0[.]0[.]1)(:[0-9]+)?)$$}
      BACKEND: http://backend:80
    ports:
      - '127.0.0.1:${NGINX_PORT:-8090}:80'
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro

  caddy:
    profiles: ['caddy']
    # Docker Official Image caddy 2.11.9; the digest pins the content, the tag lets Dependabot update both.
    image: caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    restart: unless-stopped
    depends_on: [backend]
    environment:
      ALLOWED_ORIGINS_REGEX: ${ALLOWED_ORIGINS_REGEX:-^(https://mixtura[.]nexumia[.]de|http://(localhost|127[.]0[.]0[.]1)(:[0-9]+)?)$$}
      BACKEND: backend:80
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - '127.0.0.1:${CADDY_PORT:-8091}:80'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  dav-data:
  caddy-data:
